%YAML:1.0
app:
  input_source: "mvs:0"           # mvs:0 使用 Hikrobot MVS SDK 的第 0 台相机
  onnx_model_path: "models/best_opset12.onnx"
  class_names_path: "config/classes.txt"
  calibration_file: ""

  frame_width: 1280
  frame_height: 1024
  max_frames: 120
  queue_size: 30

  conf_threshold: 0.001
  nms_threshold: 0.30

  caliper_length: 180.0
  caliper_half_width: 8.0
  gaussian_sigma: 1.0

  show_window: 0
  enable_diag_logs: 1
